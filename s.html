<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Coffrio — Document partagé</title>
<link rel="stylesheet" href="style.css">
<script>
  // La page de partage vit désormais sur coffrioapp.com (/s et /fr/s). Ce relais garde en état
  // les liens déjà envoyés : le jeton est dans le fragment (#…), que le navigateur conserve
  // d'une adresse à l'autre — il n'est donc transmis à aucun serveur, ici comme là-bas.
  // À supprimer une fois la durée de partage maximale écoulée depuis la bascule.
  //
  // NE PAS PUBLIER tant que https://coffrioapp.com/s ne répond pas : les liens en circulation
  // tomberaient sur une page absente.
  location.replace('https://coffrioapp.com/s' + location.hash);
</script>
</head>
<body>
<main>
  <p class="lang">Coffrio · document partagé / shared document</p>
  <h1>Cette page a déménagé</h1>
  <p class="muted">
    Ouvrez votre document sur <a id="go" href="https://coffrioapp.com/s">coffrioapp.com</a>.<br>
    Open your document at <a href="https://coffrioapp.com/s">coffrioapp.com</a>.
  </p>
</main>
<script>
  // Si la redirection automatique ne part pas, le lien manuel doit emporter le jeton.
  document.getElementById('go').href = 'https://coffrioapp.com/s' + location.hash;
</script>
</body>
</html>
